name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - agents/codebase-review-next-steps
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate backend JavaScript files
        run: |
          find . -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) ! -path './node_modules/*' -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend app
        run: npm run lint

      - name: Build frontend web bundle
        run: npx expo export --platform web --clear

  docker-validate:
    name: Docker validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose configuration
        env:
          POSTGRES_PASSWORD: test
          JWT_SECRET: test
        run: docker compose config >/tmp/tenantiq-compose.yml

  publish-images:
    name: Publish Docker images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs:
      - backend
      - frontend
      - docker-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tenantiq-backend:latest
            ghcr.io/${{ github.repository_owner }}/tenantiq-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tenantiq-frontend:latest
            ghcr.io/${{ github.repository_owner }}/tenantiq-frontend:${{ github.sha }}
